<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Verificar email - Interact Club</title><script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="page-content" class="auth-page">
  <div class="auth-card auth-card--wide">
    <div class="auth-head">
      <a href="/" class="auth-back">← Voltar ao site</a>
      <h1 class="auth-title auth-title--sm">Verifique seu <span>email</span></h1>
    </div>
    <div class="auth-box">
      <div id="verification-status" role="status" aria-live="polite" class="auth-status">
        Verificando seu link…
      </div>
      <a id="login-link" class="btn btn-primary btn-full auth-actions" href="/login" hidden>Ir para o login</a>
      <form id="resend-form" class="auth-actions" hidden>
        <div class="form-group"><label for="verification-email">Email</label><input type="email" id="verification-email" class="form-control" required placeholder="seu@email.com"></div>
        <button type="submit" class="btn btn-primary btn-full" id="resend-btn">Enviar novo link</button>
      </form>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/js/pages/verificar-email.js"></script>
</body>
</html>
