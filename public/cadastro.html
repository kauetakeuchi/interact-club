<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Cadastro - Interact Club</title><script>try{const t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');}catch(e){}</script><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="page-content" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:28rem;">
    <div style="text-align:center;margin-bottom:2rem;">
      <a href="/" style="display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--text);margin-bottom:2rem;">← Voltar ao site</a>
      <h1 style="font-family:var(--font-heading);font-size:2.5rem;color:var(--primary-dark);">Criar <span style="color:var(--secondary);">Conta</span></h1>
      <p style="color:var(--text);font-size:.875rem;margin-top:.5rem;">Faça parte do Interact Club</p>
    </div>
    <div style="border:1px solid var(--border);padding:2rem;">
      <form id="register-form">
        <div class="form-group"><label>Nome</label><input type="text" id="reg-name" class="form-control" required placeholder="Seu nome completo"></div>
        <div class="form-group"><label>Email</label><input type="email" id="reg-email" class="form-control" required placeholder="seu@email.com"></div>
        <div class="form-group"><label>Telefone</label><input type="tel" id="reg-phone" class="form-control" placeholder="(11) 99999-9999"></div>
        <div class="form-group"><label>Data de Nascimento</label><input type="date" id="reg-birth" class="form-control"></div>
        <div class="form-group"><label>Senha</label><div class="password-wrap"><input type="password" id="reg-password" class="form-control" required minlength="8" aria-describedby="password-hint" placeholder="Mínimo 8 caracteres"><button type="button" class="password-toggle" tabindex="-1" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><small id="password-hint" style="color:var(--text-muted);">Use maiúscula, minúscula, número e caractere especial.</small></div>
        <button type="submit" class="btn btn-primary btn-full" id="register-btn">Criar Conta</button>
        <p style="text-align:center;margin-top:1rem;font-size:.875rem;color:var(--text);">Já tem conta? <a href="/login" style="color:var(--primary);font-weight:500;">Faça login</a></p>
      </form>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/js/lib/Theme.js"></script>
<script type="module" src="/js/pages/cadastro.js"></script>
</body>
</html>
