<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Login - Interact Club</title><script src="/js/theme-init.js"></script><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="page-content" class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <a href="/" class="auth-back">← Voltar ao site</a>
      <h1 class="auth-title"><span>Interact</span> Club</h1>
      <p class="auth-subtitle">Acesse sua conta de membro</p>
    </div>
    <div class="auth-box">
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-control" required autocomplete="email" placeholder="seu@email.com"></div>
        <div class="form-group"><label>Senha</label><div class="password-wrap"><input type="password" id="login-password" class="form-control" required autocomplete="current-password" placeholder="Sua senha"><button type="button" class="password-toggle" tabindex="-1" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Entrar</button>
        <p class="auth-forgot"><a href="/esqueci-senha" class="auth-link">Esqueci minha senha</a></p>
        <a id="verification-help" hidden href="/verificar-email" class="auth-help">Reenviar email de verificação</a>
        <p class="auth-form-foot">Não tem conta? <a href="/cadastro" class="auth-link">Cadastre-se</a></p>
      </form>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/js/lib/Theme.js"></script>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
