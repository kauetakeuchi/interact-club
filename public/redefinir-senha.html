<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Redefinir senha - Interact Club</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="page-content" class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <a href="/login" class="auth-back">← Voltar ao login</a>
      <h1 class="auth-title">Nova <span>senha</span></h1>
      <p class="auth-subtitle">Crie uma senha nova para sua conta.</p>
    </div>
    <div class="auth-box">
      <form id="reset-form">
        <div class="form-group"><label>Nova senha</label><div class="password-wrap"><input type="password" id="reset-password" class="form-control" required minlength="8" autocomplete="new-password" aria-describedby="reset-password-hint" placeholder="Mínimo 8 caracteres"><button type="button" class="password-toggle" tabindex="-1" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><small id="reset-password-hint" class="auth-hint">Use maiúscula, minúscula, número e caractere especial.</small></div>
        <div class="form-group"><label>Confirmar nova senha</label><div class="password-wrap"><input type="password" id="reset-confirm" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Repita a nova senha"><button type="button" class="password-toggle" tabindex="-1" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Redefinir senha</button>
        <p id="reset-status" role="status" aria-live="polite" class="auth-message" hidden></p>
        <a id="reset-login-link" href="/login" hidden class="auth-help">Ir para o login</a>
      </form>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/js/lib/Theme.js"></script>
<script type="module" src="/js/pages/redefinir-senha.js"></script>
</body>
</html>
