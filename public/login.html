<!DOCTYPE html><html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Login - Interact Club</title><script>try{const t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');}catch(e){}</script><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div id="page-content" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:100%;max-width:28rem;">
    <div style="text-align:center;margin-bottom:2rem;">
      <a href="/" style="display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--text);margin-bottom:2rem;">← Voltar ao site</a>
      <h1 style="font-family:var(--font-heading);font-size:2.5rem;color:var(--primary-dark);"><span style="color:var(--secondary);">Interact</span> Club</h1>
      <p style="color:var(--text);font-size:.875rem;margin-top:.5rem;">Acesse sua conta de membro</p>
    </div>
    <div style="border:1px solid var(--border);padding:2rem;">
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-control" required placeholder="seu@email.com"></div>
        <div class="form-group"><label>Senha</label><div class="password-wrap"><input type="password" id="login-password" class="form-control" required placeholder="Sua senha"><button type="button" class="password-toggle" tabindex="-1" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Entrar</button>
        <a id="verification-help" hidden href="/verificar-email" style="display:block;text-align:center;margin-top:1rem;color:var(--primary);font-weight:500;font-size:.875rem;">Reenviar email de verificação</a>
        <p style="text-align:center;margin-top:1rem;font-size:.875rem;color:var(--text);">Não tem conta? <a href="/cadastro" style="color:var(--primary);font-weight:500;">Cadastre-se</a></p>
      </form>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script type="module" src="/js/lib/Theme.js"></script>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
